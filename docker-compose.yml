version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pokebot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pokebot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  migrator:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: python scripts/start_api.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "infra/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 10

  bot:
    build: .
    command: python scripts/start_bot.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  worker:
    build: .
    command: python workers/matchmaking_worker.py
    env_file:
      - .env
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started

  event_worker:
    build: .
    command: python workers/event_consumer_worker.py
    env_file:
      - .env
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started

  notification_worker:
    build: .
    command: python workers/notification_worker.py
    env_file:
      - .env
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
